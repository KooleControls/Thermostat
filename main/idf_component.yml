dependencies:
  idf:
    version: ">=5.0.0"
  espressif/mdns: ^1
  espressif/mqtt:
    version: "^1"
  lvgl/lvgl: "^9.2"
  espressif/esp_lvgl_port: "^2"
  # Touch controllers — superset across boards. The component manager reads one
  # manifest, so every board's touch driver is fetched; only the selected
  # board's Touch.h #includes one, so the rest are never compiled in.
  espressif/esp_lcd_touch_gt911: "^1"      # Sunton ESP32-8048S043
  # Elecrow CrowPanel 2.1" drivers. These components only publish esp32s3/p4
  # variants, so they are target-gated — a stray plain-esp32 configure won't
  # fail dependency solving over them. Both supported boards are esp32s3, so
  # they resolve for either board.
  espressif/esp_lcd_touch_cst816s:         # CST826, CST816 family
    version: "^1"
    rules:
      - if: "target in [esp32s3, esp32p4]"
  # ST7701S (3-wire SPI init + RGB). esp_lcd_panel_io_additions provides the
  # 3-wire SPI panel-IO used for the init sequence. The Sunton board uses the
  # built-in esp_lcd RGB driver (no dep).
  espressif/esp_lcd_st7701:
    version: "^2"
    rules:
      - if: "target in [esp32s3, esp32p4]"
  espressif/esp_lcd_panel_io_additions:
    version: "^1"
    rules:
      - if: "target in [esp32s3, esp32p4]"
